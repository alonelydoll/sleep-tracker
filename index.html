<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Agenda du Sommeil ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fbf7ff;
      --card-bg: rgba(255, 255, 255, 0.90);
      --card-border: #ebdfff;
      --primary: #9b82e3;
      --primary-hover: #8365d6;
      --primary-light: #f3edff;
      --pink: #f7a8b8;
      --pink-light: #fff0f3;
      --mint: #a8e6cf;
      --mint-light: #e8f8f2;
      --yellow: #ffd3b6;
      --yellow-light: #fff5eb;
      --text-dark: #4a4453;
      --text-muted: #8c8299;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --shadow: 0 10px 30px rgba(155, 130, 227, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    /* FOND À PETITS POIS DU DEBUT (KAWAII POLKA DOTS) */
    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(#ebdfff 20%, transparent 20%),
        radial-gradient(#f7e1ed 20%, transparent 20%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px 12px;
      position: relative;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-md);
      border: 2px solid var(--card-border);
      box-shadow: 0 4px 15px rgba(155, 130, 227, 0.08);
    }

    .logo-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon-text {
      background: white;
      border: 1px solid var(--card-border);
      color: var(--primary);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .btn-icon-text:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
    }

    /* Cards Layout */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-family: 'Fredoka', sans-serif;
      color: var(--primary);
      font-size: 1.25rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Fields */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .form-group input[type="date"],
    .form-group input[type="time"] {
      padding: 10px 14px;
      border: 2px solid var(--card-border);
      border-radius: var(--radius-sm);
      background: white;
      color: var(--text-dark);
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(155, 130, 227, 0.2);
    }

    /* Interruption Timeline */
    .timeline-container {
      margin: 20px 0;
      background: white;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
    }
